# 双曲线约束案例配置
# 与 MATLAB legacy 示例对齐
# 状态约束: x1^2 - x2^2 <= 4 且 4*x2^2 - x1^2 <= 16
# 收缩约束模式：使用收缩的双曲线约束和收缩的候选集进行前向可达性分析


name = hyperbolic_demo

# 状态空间: x, y, theta, speed
state_lb = -3.5, -3.5, -3.141592653589793, 0.0
state_ub =  3.5,  3.5,  3.141592653589793, 2.0
state_eta = 0.1, 0.1, 0.1, 0.1
wrap_dim = 2

# 输入空间: 速度, 角速度
input_lb = 0.2, -1.0
input_ub = 2.0,  1.0
input_eta = 0.3, 0.4

# 候选集（目标区域）- 原始候选集
candidate_lb = -1.0, -1.0, -3.141592653589793, 0.2
candidate_ub =  1.0,  1.0,  3.141592653589793, 2.0

# 收缩候选集 - 用于前向可达性计算的初始集合
candidate_contracted_lb = -0.8, -0.8, -3.141592653589793, 0.0
candidate_contracted_ub =  0.8,  0.8,  3.141592653589793, 1.0

# map 边界
map_lb = -3.5, -3.5, -3.141592653589793, 0.0
map_ub =  3.5,  3.5,  3.141592653589793, 2.0

# 双曲线约束（原始）: x1^2 - x2^2 <= a 且 b*x2^2 - x1^2 <= c
constraint_type = hyperbolic
hyperbolic_a = 4.0
hyperbolic_b = 4.0
hyperbolic_c = 16.0

# 收缩双曲线约束（按因子 0.8 缩放）
# a_c = 4.0 * 0.8^2 = 2.56
# b_c = 4.0 (保持不变)
# c_c = 16.0 * 0.8^2 = 10.24
hyperbolic_contracted_a = 2.56
hyperbolic_contracted_b = 4.0
hyperbolic_contracted_c = 10.24

# 名义模型（扰动为0）
disturbance_half_width = 0.0, 0.0, 0.0, 0.0

sample_time = 0.5
integration_substeps = 32
max_iterations = 100
verbose = true