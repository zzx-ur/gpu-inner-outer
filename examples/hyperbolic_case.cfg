# 双曲线约束案例配置
# 与 MATLAB legacy 示例对齐
# 状态约束: x1^2 - x2^2 <= 4 且 4*x2^2 - x1^2 <= 16


name = hyperbolic_demo

# 状态空间: x, y, theta, speed
state_lb = -3.5, -3.5, -3.2, 0.1
state_ub =  3.5,  3.5,  3.2, 1.1
state_eta = 0.1, 0.1, 0.1, 0.1
wrap_dim = 2

# 输入空间: 加速度, 角速度
input_lb = -1.0, -1.0
input_ub = 1.0,  1.0
input_eta = 0.2, 0.2

# 候选集（目标区域）
candidate_lb = -0.8, -0.8, -3.141592653589793, 0.2
candidate_ub =  0.8,  0.8,  3.141592653589793, 0.9

# map 边界
map_lb = -3.5, -3.5, -3.2, 0.1
map_ub =  3.5,  3.5,  3.2, 1.1

# 双曲线约束: x1^2 - x2^2 <= a 且 b*x2^2 - x1^2 <= c
constraint_type = hyperbolic
hyperbolic_a = 4.0
hyperbolic_b = 4.0
hyperbolic_c = 16.0

# 扰动
disturbance_half_width = 0.1, 0.1, 0.1, 0.05

sample_time = 1.0
integration_substeps = 32
max_iterations = 100
verbose = true